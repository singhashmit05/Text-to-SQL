services:
  - type: web
    name: text-to-sql-agent-api
    env: docker
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ADMIN_URL
        sync: false
      - key: MAX_ROWS_RETURNED
        value: "200"
      - key: DEFAULT_TOP_K
        value: "5"
      - key: QUERY_TIMEOUT_SECONDS
        value: "15"
      - key: CORS_ALLOW_ORIGINS
        sync: false   # set to your Vercel frontend URL after first deploy
